<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Simple Controller SF300</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #3175a3; /* biru cisco */
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }
        .login-card { 
            width: 100%; 
            max-width: 400px; 
            padding: 40px 30px; 
            border-radius: 20px; /* rounded */
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            background-color: white; 
        }
        .form-control {
            border-radius: 12px; /* box agak bulat */
            padding: 10px 15px;
        }
        .btn-cisco {
            background-color: #3175a3;
            color: white;
            border-radius: 25px; /* tombol kapsul */
            padding: 10px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-cisco:hover {
            background-color: #245b82; /* warna pas hover */
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <h3 style="color: #3175a3; font-weight: 800;">Simple Controller</h3>
            <p class="text-muted">Port Security SF300</p>
        </div>
        
        <form method="POST" action="/">
            <div class="mb-3">
                <label for="username" class="form-label fw-bold" style="color: #444;">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Masukkan Username" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-bold" style="color: #444;">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Masukkan Password" required>
            </div>
            <button type="submit" class="btn btn-cisco w-100">Login</button>
        </form>
    </div>
</body>
</html>
